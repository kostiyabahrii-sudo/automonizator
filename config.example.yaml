# Скопіюй у config.yaml і підлаштуй під себе.

# Звідки брати готові картинки і куди їх переносити після публікації.
pending_dir: posts/pending
posted_dir: posts/posted
failed_dir: posts/failed

state_file: state/state.json
log_file: logs/poster.log

# Випадковий інтервал між постами (у годинах). Береться випадкове число
# з діапазону при кожній успішній публікації, тому проміжки не однакові
# й не виглядають як робота бота за розкладом "рівно раз в N годин".
interval_hours_min: 5
interval_hours_max: 6

# Опис, що йде під кожним піном. Теги пишемо прямо в тексті опису
# (Pinterest не має окремого API-поля для тегів/хештегів у v5,
# вони просто частина description і розпізнаються з тексту).
# Можна вказати один рядок або список — якщо список, для кожного
# поста випадково береться один варіант (легка природна варіативність,
# не обов'язково).
description: >
  Опис поста. Тут заготовлений текст, який буде під кожним піном.
  #тег1 #тег2 #тег3

# Необов'язкове посилання, куди веде пін (сайт/магазин/лендінг).
link: ""

# Формувати title з імені файлу (без розширення, підкреслення -> пробіли,
# перша літера кожного слова велика).
title_from_filename: true

# alt_text (опис картинки для доступності) — за замовчуванням береться title.
alt_text_from_title: true
